<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo Pronto · Gestão</title><link rel="stylesheet" href="/operacao.css"><link rel="stylesheet" href="/gestao.css"><link rel="stylesheet" href="/ajuda.css">
<link rel="stylesheet" href="/onboarding.css"><link rel="stylesheet" href="/casca.css"><link rel="stylesheet" href="/tema.css">
<script src="/casca.js"></script>
<script type="module" src="/gestao.js"></script></head><body>
<header id="casca" class="casca" data-pagina="gestao"></header>
<div class="estrutura"><main><p id="aviso" role="status" hidden></p><div class="filtros" id="periodo">
<label>De<input type="date" id="inicio"></label><label>Até<input type="date" id="fim"></label><button id="atualizar">Atualizar período</button>
</div><p class="ajuda-periodo" id="ajudaPeriodo">De e Até filtram os valores do período. Cards marcados como saldo acumulado e a carteira por cliente consideram todo o histórico.</p><section id="conteudo" aria-live="polite"></section></main></div>
<dialog id="formDialog"><form id="formDinamico"><h2 id="formTitulo"></h2><p id="formDica" class="suave"></p><div id="formCampos" class="grade"></div>
<p class="erro" id="formErro" role="alert"></p><div class="acoes"><button type="button" id="cancelar">Cancelar</button><button type="submit" class="principal">Salvar</button></div></form></dialog>
<dialog id="confirmDialog"><h2>Confirmar ação</h2><p id="confirmTexto"></p><div class="acoes"><button id="nao">Cancelar</button><button id="sim" class="principal">Confirmar</button></div></dialog>
</body></html>
