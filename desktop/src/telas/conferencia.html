<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
<title>Conferência do catálogo</title>
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="secao.css">
<link rel="stylesheet" href="conferencia.css">
</head>
<body>
<main>
  <section id="vazio" class="vazio vidro">
    <h1>Conferência do catálogo</h1>
    <p>Clique em <b>Conferir catálogo</b>, no alto da janela. O app lê todos os produtos da loja no Cardapio.ai e compara com o que revisamos no painel.</p>
    <p class="suave" id="ultima"></p>
  </section>
  <section id="resultado" class="escondido">
    <header class="cabeca">
      <div><h1>Conferência de <span id="loja"></span></h1><p class="suave" id="quando"></p></div>
      <span id="selo" class="selo-situacao"></span>
    </header>
    <p id="avisoSalvar" class="aviso escondido"></p>
    <div id="totais" class="totais"></div>
    <div id="grupos"></div>
  </section>
</main>
<script src="conferencia.js"></script>
</body>
</html>
